<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-seo>Cedarfield Academy · Demo school website by Sonath Solutions</title>
    <meta data-seo name="description" content="Cedarfield Academy is a fictional Nairobi school used as a website demonstration by Sonath Solutions. Explore programmes from Pre-Primary to Junior School, admissions and school life." />
    <meta name="theme-color" content="#123327" />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / social sharing. Tags marked data-seo are defaults for crawlers
         that do not run JavaScript; the app replaces them per page (see src/components/Seo.tsx). -->
    <meta data-seo property="og:type" content="website" />
    <meta property="og:site_name" content="Cedarfield Academy (demo)" />
    <meta data-seo property="og:title" content="Cedarfield Academy · A school website demo by Sonath Solutions" />
    <meta data-seo property="og:description" content="A fictional, fully responsive school website showing programmes, admissions, school life, news and enquiries." />
    <meta data-seo property="og:image" content="https://cedarfield-academy.example/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_KE" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <noscript>
      <p style="padding:1rem;font-family:sans-serif">Cedarfield Academy is a demonstration website. Please enable JavaScript to view it.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
